name: Publish gem

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected gem version (must match lib/fastlane/plugin/datadog/version.rb)'
        required: true
        type: string

concurrency:
  group: rubygems-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build and push gem to RubyGems.org
    runs-on: ubuntu-latest
    environment: rubygems.org # see: https://github.com/DataDog/datadog-fastlane-plugin/settings/environments
    permissions:
      contents: read # check out the repository
      id-token: write # request an OIDC token for RubyGems Trusted Publishing
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Verify the workflow runs from master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Publishing is only allowed from master, got $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-tags: true
          persist-credentials: false

      # rake release needs a branch checkout, so check out master and make sure it
      # still points at the commit this run was dispatched (and approved) for.
      - name: Verify master has not moved since dispatch
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "master moved to $(git rev-parse HEAD) since this run was dispatched for $GITHUB_SHA, dispatch it again"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Verify version format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver (e.g. 0.3.0)"
            exit 1
          fi

      - name: Verify version matches version.rb
        run: |
          actual=$(ruby -Ilib -r fastlane/plugin/datadog/version -e 'puts Fastlane::Datadog::VERSION')
          if [ "$VERSION" != "$actual" ]; then
            echo "Version mismatch: input=$VERSION version.rb=$actual"
            exit 1
          fi

      # An existing tag on this commit means a previous run pushed the tag but failed
      # to push the gem; rake release skips tagging in that case, so allow the retry.
      - name: Verify release tag is new or points at this commit
        run: |
          if tag_sha=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}"); then
            if [ "$tag_sha" != "$(git rev-parse HEAD)" ]; then
              echo "Tag v$VERSION already exists on another commit ($tag_sha)"
              exit 1
            fi
            echo "Tag v$VERSION already points at this commit, retrying the gem push"
          fi

      - name: Run tests
        run: bundle exec rake

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/datadog-fastlane-plugin
          policy: self.publish

      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
